<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1630" />
      <stop offset="55%" stop-color="#2b3a6b" />
      <stop offset="100%" stop-color="#141c42" />
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f2c14e" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- star field -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2.4" opacity=".8" />
    <circle cx="300" cy="52" r="1.6" opacity=".5" />
    <circle cx="480" cy="120" r="2" opacity=".65" />
    <circle cx="700" cy="70" r="1.4" opacity=".45" />
    <circle cx="920" cy="140" r="2.2" opacity=".7" />
    <circle cx="1080" cy="60" r="1.6" opacity=".5" />
    <circle cx="180" cy="520" r="1.8" opacity=".5" />
    <circle cx="1010" cy="470" r="2" opacity=".6" />
  </g>

  <!-- crescent -->
  <g>
    <circle cx="1040" cy="200" r="88" fill="#f2c14e" />
    <circle cx="1000" cy="172" r="80" fill="#222b52" />
  </g>

  <text x="88" y="250" font-family="Georgia, serif" font-size="34" letter-spacing="6" fill="#ffffff" opacity=".55">A BOOKMOJO ORIGINAL</text>
  <text x="88" y="360" font-family="Georgia, serif" font-size="96" font-weight="700" fill="url(#foil)">Your child, the hero</text>
  <text x="88" y="452" font-family="Georgia, serif" font-size="96" font-weight="700" fill="#ffffff" opacity=".92">of their own book.</text>
  <text x="90" y="530" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#ffffff" opacity=".7">Personalised hardcover storybooks · ordered in one WhatsApp chat</text>

  <rect x="88" y="566" width="290" height="8" rx="4" fill="#0f9d54" />
</svg>
