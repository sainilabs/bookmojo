name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, and only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an in-flight one rather than race it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `ci`, not `install`: installs exactly the locked tree and fails loudly if
      # package.json and the lockfile have drifted apart.
      - run: npm ci

      # Typecheck runs as part of `build` (tsc -b && vite build), so a type error
      # blocks the deploy instead of shipping a broken page.
      - run: npm run build
        env:
          VITE_BASE: /bookmojo/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
